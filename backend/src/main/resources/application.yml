spring:
  application:
    name: magic-gold-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/magicgold}
    username: ${DB_USERNAME:magicgold}
    password: ${DB_PASSWORD:magicgold}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8083/realms/magicgold}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8083/realms/magicgold/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

app:
  currency: XOF
  keycloak:
    client-id: ${KEYCLOAK_CLIENT_ID:magic-gold-api}
    principal-attribute: preferred_username
    merchant-claim: merchant_id
